[package]
name = "zym-source-m3u"
version = "0.1.0"
edition = "2024"
description = "Zym Media Player content plugin: IPTV channels from an M3U/M3U8 playlist"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Standalone: not part of the player's build.
[workspace]
