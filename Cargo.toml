[package]
name = "zym-media-player"
version = "0.1.2"
edition = "2024"
rust-version = "1.93"
description = "Zym Media Player — a lightweight media player built on mpv and GPUI"
license = "GPL-3.0-or-later"
repository = "https://github.com/zeet2020/Zym-media-player"

[dependencies]
anyhow = "1"
extism = "~1.13"  # 1.14+ pulls wasmtime needing Rust > 1.93
futures = "0.3"
gpui = "0.2"
image = { version = "0.25", default-features = false }
libmpv2-sys = "4.0.1"
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", default-features = false }
suppaftp = "13.0.0"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync"] }
ureq = "3"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

# gpui 0.2.2 -> zed-async-tar -> xattr 0.2.3 breaks on libc >= 0.2.191 (ENOATTR removed)
[patch.crates-io]
xattr = { path = "vendor/xattr" }
# extism 1.13's HTTP host fn rejects non-standard methods (PROPFIND) via ureq 3 defaults; 2-line patch.
extism = { path = "vendor/extism" }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.20"

# Linux packages (built in .github/workflows/release.yml).
[package.metadata.deb]
maintainer = "Zym Media Player"
section = "video"
extended-description = "Lightweight media player built on libmpv with a GPUI interface. Plays anything mpv plays; supports mpv scripts and sandboxed WebAssembly content plugins."
# $auto -> libmpv2, libxcb1, libxkbcommon*; vulkan + wayland-client are dlopen()ed so list them.
depends = "$auto, libvulkan1, libwayland-client0"
# Renamed from zym-player (0.1.0): upgrading removes the old package instead of installing beside it.
conflicts = "zym-player"
replaces = "zym-player"
provides = "zym-player"
assets = [
    ["target/release/zym-media-player", "usr/bin/", "755"],
    ["packaging/zym-media-player.desktop", "usr/share/applications/", "644"],
    # Bundled content plugins (built by the workflow before packaging).
    ["sources/m3u/manifest.json", "usr/share/zym-media-player/sources/org.zym.m3u/manifest.json", "644"],
    ["sources/m3u/target/wasm32-unknown-unknown/release/zym_source_m3u.wasm", "usr/share/zym-media-player/sources/org.zym.m3u/plugin.wasm", "644"],
    ["sources/webdav/manifest.json", "usr/share/zym-media-player/sources/org.zym.webdav/manifest.json", "644"],
    ["sources/webdav/target/wasm32-unknown-unknown/release/zym_source_webdav.wasm", "usr/share/zym-media-player/sources/org.zym.webdav/plugin.wasm", "644"],
    ["sources/ftp/manifest.json", "usr/share/zym-media-player/sources/org.zym.ftp/manifest.json", "644"],
    ["sources/ftp/target/wasm32-unknown-unknown/release/zym_source_ftp.wasm", "usr/share/zym-media-player/sources/org.zym.ftp/plugin.wasm", "644"],
    ["sources/stremio/manifest.json", "usr/share/zym-media-player/sources/org.zym.stremio/manifest.json", "644"],
    ["sources/stremio/target/wasm32-unknown-unknown/release/zym_source_stremio.wasm", "usr/share/zym-media-player/sources/org.zym.stremio/plugin.wasm", "644"],
    ["LICENSE", "usr/share/doc/zym-media-player/LICENSE", "644"],
    ["THIRD-PARTY-LICENSES.md", "usr/share/doc/zym-media-player/THIRD-PARTY-LICENSES.md", "644"],
    ["packaging/zym-media-player.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/icons/zym-media-player-16.png", "usr/share/icons/hicolor/16x16/apps/zym-media-player.png", "644"],
    ["packaging/icons/zym-media-player-24.png", "usr/share/icons/hicolor/24x24/apps/zym-media-player.png", "644"],
    ["packaging/icons/zym-media-player-32.png", "usr/share/icons/hicolor/32x32/apps/zym-media-player.png", "644"],
    ["packaging/icons/zym-media-player-48.png", "usr/share/icons/hicolor/48x48/apps/zym-media-player.png", "644"],
    ["packaging/icons/zym-media-player-64.png", "usr/share/icons/hicolor/64x64/apps/zym-media-player.png", "644"],
    ["packaging/icons/zym-media-player-128.png", "usr/share/icons/hicolor/128x128/apps/zym-media-player.png", "644"],
    ["packaging/icons/zym-media-player-256.png", "usr/share/icons/hicolor/256x256/apps/zym-media-player.png", "644"],
    ["packaging/icons/zym-media-player-512.png", "usr/share/icons/hicolor/512x512/apps/zym-media-player.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/zym-media-player", dest = "/usr/bin/zym-media-player", mode = "755" },
    { source = "packaging/zym-media-player.desktop", dest = "/usr/share/applications/zym-media-player.desktop", mode = "644" },
    { source = "sources/m3u/manifest.json", dest = "/usr/share/zym-media-player/sources/org.zym.m3u/manifest.json", mode = "644" },
    { source = "sources/m3u/target/wasm32-unknown-unknown/release/zym_source_m3u.wasm", dest = "/usr/share/zym-media-player/sources/org.zym.m3u/plugin.wasm", mode = "644" },
    { source = "sources/webdav/manifest.json", dest = "/usr/share/zym-media-player/sources/org.zym.webdav/manifest.json", mode = "644" },
    { source = "sources/webdav/target/wasm32-unknown-unknown/release/zym_source_webdav.wasm", dest = "/usr/share/zym-media-player/sources/org.zym.webdav/plugin.wasm", mode = "644" },
    { source = "sources/ftp/manifest.json", dest = "/usr/share/zym-media-player/sources/org.zym.ftp/manifest.json", mode = "644" },
    { source = "sources/ftp/target/wasm32-unknown-unknown/release/zym_source_ftp.wasm", dest = "/usr/share/zym-media-player/sources/org.zym.ftp/plugin.wasm", mode = "644" },
    { source = "sources/stremio/manifest.json", dest = "/usr/share/zym-media-player/sources/org.zym.stremio/manifest.json", mode = "644" },
    { source = "sources/stremio/target/wasm32-unknown-unknown/release/zym_source_stremio.wasm", dest = "/usr/share/zym-media-player/sources/org.zym.stremio/plugin.wasm", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/zym-media-player/LICENSE", mode = "644", doc = false },
    { source = "THIRD-PARTY-LICENSES.md", dest = "/usr/share/licenses/zym-media-player/THIRD-PARTY-LICENSES.md", mode = "644", doc = false },
    { source = "packaging/zym-media-player.svg", dest = "/usr/share/icons/hicolor/scalable/apps/zym-media-player.svg", mode = "644" },
    { source = "packaging/icons/zym-media-player-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/zym-media-player.png", mode = "644" },
    { source = "packaging/icons/zym-media-player-24.png", dest = "/usr/share/icons/hicolor/24x24/apps/zym-media-player.png", mode = "644" },
    { source = "packaging/icons/zym-media-player-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/zym-media-player.png", mode = "644" },
    { source = "packaging/icons/zym-media-player-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/zym-media-player.png", mode = "644" },
    { source = "packaging/icons/zym-media-player-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/zym-media-player.png", mode = "644" },
    { source = "packaging/icons/zym-media-player-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/zym-media-player.png", mode = "644" },
    { source = "packaging/icons/zym-media-player-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/zym-media-player.png", mode = "644" },
    { source = "packaging/icons/zym-media-player-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/zym-media-player.png", mode = "644" },
]
# auto-req would scan the build host (Ubuntu) with ldd and pin its transitive sonames
# (libavcodec.so.62, ...), which Fedora can't satisfy. List Fedora package names instead.
auto-req = "no"
# Renamed from zym-player (0.1.0): the upgrade replaces the old package.
[package.metadata.generate-rpm.obsoletes]
zym-player = "*"

[package.metadata.generate-rpm.requires]
mpv-libs = "*"
libxcb = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libwayland-client = "*"
vulkan-loader = "*"
